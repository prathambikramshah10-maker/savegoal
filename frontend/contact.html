<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SaveGoal</title>
  <meta name="description" content="Get in touch with the SaveGoal team. Send us feedback, report bugs, or ask questions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <nav class="nav" id="mainNav"></nav>
  <div class="page-content">
    <div class="container" style="max-width:700px;">
      <div class="dashboard-header" style="text-align:center;margin-bottom:48px;">
        <h1>Contact Us</h1>
        <p>Have a question or feedback? We'd love to hear from you.</p>
      </div>

      <div class="card" style="margin-bottom:32px;">
        <h3 style="margin-bottom:20px;">Send us a message</h3>
        <form id="contactForm">
          <div class="form-group">
            <label class="form-label" for="contactName">Your Name</label>
            <input type="text" id="contactName" class="form-input" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contactEmail">Email Address</label>
            <input type="email" id="contactEmail" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contactSubject">Subject</label>
            <select id="contactSubject" class="form-select" required>
              <option value="">Select a topic</option>
              <option value="feedback">Feedback</option>
              <option value="bug">Bug Report</option>
              <option value="feature">Feature Request</option>
              <option value="question">General Question</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="contactMessage">Message</label>
            <textarea id="contactMessage" class="form-textarea" rows="5" placeholder="Tell us what's on your mind..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
        </form>
        <div id="contactSuccess" style="display:none;text-align:center;padding:40px 0;">
          <div style="font-size:3rem;margin-bottom:16px;">✉️</div>
          <h3 style="margin-bottom:8px;">Message Sent!</h3>
          <p>Thank you for reaching out. We'll get back to you as soon as possible.</p>
          <a href="index.html" class="btn btn-primary" style="margin-top:16px;">Back to Home</a>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;">
        <div class="card" style="text-align:center;">
          <div style="font-size:2rem;margin-bottom:12px;">📧</div>
          <h4>Email</h4>
          <p style="font-size:0.9rem;">prathambikramshah10@gmail.com</p>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:2rem;margin-bottom:12px;">🌍</div>
          <h4>Location</h4>
          <p style="font-size:0.9rem;">Nepal</p>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:2rem;margin-bottom:12px;">⏰</div>
          <h4>Response Time</h4>
          <p style="font-size:0.9rem;">Within 48 hours</p>
        </div>
      </div>
    </div>
  </div>
  <script src="js/utils.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type="submit"]');
      const name = document.getElementById('contactName').value.trim();
      const email = document.getElementById('contactEmail').value.trim();
      const subject = document.getElementById('contactSubject').value;
      const message = document.getElementById('contactMessage').value.trim();

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch(API_BASE + '/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, subject, message })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not send message');
        this.style.display = 'none';
        document.getElementById('contactSuccess').style.display = 'block';
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = 'Send Message';
      }
    });
  </script>
</body>
</html>
