<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your SaveGoal account password.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Reset Password - SaveGoal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:460px;">
      <div class="auth-header">
        <div class="logo">
          <div class="logo-icon">SG</div>
          SaveGoal
        </div>
        <h2 id="stepTitle">Reset your password</h2>
        <p id="resetSubtitle">Enter your email to receive a reset code</p>
      </div>

      <!-- Step 1: Enter email -->
      <form id="forgotForm">
        <div class="form-error-global" id="forgotError" style="display:none;padding:12px 16px;background:rgba(196,77,77,0.1);border:1px solid rgba(196,77,77,0.2);border-radius:var(--radius);color:var(--danger);font-size:0.9rem;margin-bottom:20px;"></div>
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" class="form-input" placeholder="" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="sendResetBtn">Send Reset Code</button>
      </form>

      <!-- Step 2: Enter code + new password (hidden initially) -->
      <form id="resetForm" style="display:none;">
        <div class="form-error-global" id="resetError" style="display:none;padding:12px 16px;background:rgba(196,77,77,0.1);border:1px solid rgba(196,77,77,0.2);border-radius:var(--radius);color:var(--danger);font-size:0.9rem;margin-bottom:20px;"></div>
        <div class="form-success-global" id="resetSuccess" style="display:none;padding:12px 16px;background:rgba(63,167,108,0.1);border:1px solid rgba(63,167,108,0.2);border-radius:var(--radius);color:var(--success);font-size:0.9rem;margin-bottom:20px;"></div>

        <div class="form-group">
          <label class="form-label" for="resetCode">Verification Code</label>
          <input type="text" id="resetCode" class="form-input" placeholder="6-digit code from your email" required inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetPasswordBtn">Reset Password</button>
      </form>

      <div class="auth-footer">
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (() => {
      try {
        const { protocol, hostname, port } = window.location;
        if (protocol === 'file:') return 'http://localhost:5000/api';
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
          if (port === '5000') return '/api';
          return 'http://localhost:5000/api';
        }
        return '/api';
      } catch (e) {
        return '/api';
      }
    })();

    let resetEmail = '';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const errDiv = document.getElementById('forgotError');
      const btn = document.getElementById('sendResetBtn');

      if (!email) {
        errDiv.textContent = 'Please enter your email';
        errDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      errDiv.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok) {
          errDiv.textContent = data.error || 'Something went wrong';
          errDiv.style.display = 'block';
          return;
        }

        resetEmail = email;

        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('resetForm').style.display = 'block';
        document.getElementById('stepTitle').textContent = 'Enter reset code';
        document.getElementById('resetSubtitle').textContent =
          data.devCode
            ? `Dev mode — your code: ${data.devCode}`
            : `A 6-digit code was sent to ${email}`;

        if (data.devCode) {
          const errDiv2 = document.getElementById('forgotError');
          errDiv2.textContent = `Dev code: ${data.devCode}`;
          errDiv2.style.display = 'block';
        }
      } catch (err) {
        errDiv.textContent = 'Cannot connect to server. Make sure the backend is running.';
        errDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Code';
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('resetCode').value.trim();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const errDiv = document.getElementById('resetError');
      const successDiv = document.getElementById('resetSuccess');
      const btn = document.getElementById('resetPasswordBtn');

      errDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (!code || !/^\d{6}$/.test(code)) {
        errDiv.textContent = 'Please enter a valid 6-digit code';
        errDiv.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errDiv.textContent = 'Password must be at least 6 characters';
        errDiv.style.display = 'block';
        return;
      }

      if (password !== confirm) {
        errDiv.textContent = 'Passwords do not match';
        errDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: resetEmail, code, newPassword: password })
        });
        const data = await res.json();

        if (!res.ok) {
          errDiv.textContent = data.error || 'Something went wrong';
          errDiv.style.display = 'block';
          return;
        }

        successDiv.textContent = 'Password reset successful! Redirecting to login...';
        successDiv.style.display = 'block';
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } catch (err) {
        errDiv.textContent = 'Cannot connect to server. Make sure the backend is running.';
        errDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
