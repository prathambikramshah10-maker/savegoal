<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your SaveGoal account and continue your savings journey.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Login - SaveGoal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <div class="logo-icon">SG</div>
          SaveGoal
        </div>
        <h2>Welcome back</h2>
        <p>Sign in to continue your savings journey</p>
      </div>

      <div class="form-error-global" style="display:none;padding:12px 16px;background:rgba(196,77,77,0.1);border:1px solid rgba(196,77,77,0.2);border-radius:var(--radius);color:var(--danger);font-size:0.9rem;margin-bottom:20px;"></div>

      <!-- Step 1: Email + password -->
      <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="toggle-pw" onclick="togglePassword('password', this)" aria-label="Show or hide password" tabindex="-1">👁</button>
            </div>
          </div>

          <div style="display:flex;justify-content:flex-end;margin-bottom:24px;">
            <a href="forgot-password.html" style="font-size:0.85rem;color:var(--champagne);font-weight:500;">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
      </form>

      <!-- Step 2: Verification code (hidden until password is accepted) -->
      <div id="otpStep2" style="display:none;">
        <div style="padding:14px 16px;background:var(--primary-bg);border-radius:var(--radius);margin-bottom:16px;">
          <div style="font-size:0.85rem;color:var(--text-muted);" id="otpStatus">Verification code sent. Checking your inbox — it expires in 5 minutes.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="otpCode">6-digit verification code</label>
          <input type="text" id="otpCode" class="form-input" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="letter-spacing:6px;font-weight:700;text-align:center;">
        </div>
        <button type="button" class="btn btn-primary btn-block btn-lg" id="verifyOtpBtn" onclick="handleVerifyOtp()">Verify & Sign In</button>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">
          <button type="button" class="btn btn-ghost" id="resendOtpBtn" onclick="handleResendOtp()" disabled style="font-size:0.85rem;">Resend Code</button>
          <span style="font-size:0.85rem;color:var(--text-muted);" id="otpCountdown"></span>
        </div>
        <div style="margin-top:16px;text-align:center;">
          <button type="button" class="btn btn-ghost" onclick="resetOtpPanel()" style="font-size:0.85rem;">← Go back and sign in again</button>
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
