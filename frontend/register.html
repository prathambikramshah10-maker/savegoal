<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SaveGoal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <div class="logo-icon">SG</div>
          SaveGoal
        </div>
        <h2>Create your account</h2>
        <p>Start your savings journey today</p>
      </div>

      <form id="registerForm">
        <div class="form-error-global" style="display:none;padding:12px 16px;background:rgba(196,77,77,0.1);border:1px solid rgba(196,77,77,0.2);border-radius:var(--radius);color:var(--danger);font-size:0.9rem;margin-bottom:20px;"></div>

        <div id="registerDetails">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-input" placeholder="PrathamDada" required autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-input" placeholder="9841234567" required autocomplete="tel">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;">Create Account</button>
        </div>

        <div id="registerOtp" style="display:none;">
          <div id="devOtpHint" style="display:none;margin-bottom:20px;padding:12px 14px;border-radius:var(--radius);background:rgba(212,175,106,0.08);border:1px solid rgba(212,175,106,0.25);font-size:0.85rem;line-height:1.6;color:var(--text);"></div>
          <div class="form-group">
            <label class="form-label" for="regOtpCode">Verification Code</label>
            <input type="text" id="regOtpCode" class="form-input" placeholder="Enter the 6-digit code sent to your email" inputmode="numeric" maxlength="6" required>
          </div>
          <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:24px;">We sent a one-time code to your email to verify your account. It expires in 10 minutes.</p>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="verifyRegisterBtn">Verify & Create Account</button>
          <div style="text-align:center;margin-top:16px;font-size:0.9rem;">
            Didn't get it? <a href="#" id="resendRegOtp" style="color:var(--champagne);font-weight:600;">Resend code</a>
          </div>
        </div>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
