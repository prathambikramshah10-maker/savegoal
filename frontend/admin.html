<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SaveGoal admin panel. Monitor your clients' savings and manage users.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Admin Panel - SaveGoal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav" id="mainNav"></nav>

  <div class="page-content">
    <div class="container">
      <div class="dashboard-header">
        <h1>Admin Panel</h1>
        <p>Monitor your clients' savings and manage users</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card primary">
          <div class="stat-icon">👥</div>
          <div class="stat-value" id="statUsers">-</div>
          <div class="stat-label">Total Clients</div>
        </div>
        <div class="stat-card accent">
          <div class="stat-icon">💵</div>
          <div class="stat-value" id="statDeposited">-</div>
          <div class="stat-label">Total Deposited</div>
        </div>
        <div class="stat-card info">
          <div class="stat-icon">🏧</div>
          <div class="stat-value" id="statWithdrawn">-</div>
          <div class="stat-label">Total Withdrawn</div>
        </div>
        <div class="stat-card secondary">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="statSavings">-</div>
          <div class="stat-label">Platform Savings</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎯</div>
          <div class="stat-value" id="statGoals">-</div>
          <div class="stat-label">Total Goals</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-value" id="statCompleted">-</div>
          <div class="stat-label">Completed Goals</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💸</div>
          <div class="stat-value" id="statTransactions">-</div>
          <div class="stat-label">Transactions</div>
        </div>
      </div>

      <div class="section-header">
        <h2 class="section-title">All Clients — Savings Overview</h2>
        <button class="btn btn-secondary btn-sm" onclick="exportClientCSV()">📥 Export All Client Data</button>
      </div>

      <div id="adminUsersContainer">
        <div class="loading-overlay">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Client detail modal -->
  <div class="modal-overlay" id="userModalOverlay" style="display:none;" onclick="if(event.target===this)closeUserModal()">
    <div class="modal" style="max-width:640px;max-height:88vh;overflow-y:auto;">
      <div class="modal-header">
        <h3 id="userModalTitle">Client Details</h3>
        <button class="modal-close" onclick="closeUserModal()">×</button>
      </div>
      <div id="userModalBody">
        <div class="loading-overlay"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
