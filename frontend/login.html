<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your SaveGoal account and continue your savings journey.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Login - SaveGoal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <div class="logo-icon">SG</div>
          SaveGoal
        </div>
        <h2>Welcome back</h2>
        <p>Sign in to continue your savings journey</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-error-global" style="display:none;padding:12px 16px;background:rgba(196,77,77,0.1);border:1px solid rgba(196,77,77,0.2);border-radius:var(--radius);color:var(--danger);font-size:0.9rem;margin-bottom:20px;"></div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
          </div>

          <div style="display:flex;justify-content:flex-end;margin-bottom:24px;">
            <a href="forgot-password.html" style="font-size:0.85rem;color:var(--champagne);font-weight:500;">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
